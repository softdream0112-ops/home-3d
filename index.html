<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Meu site</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}

/* CANVAS DO CORAÇÃO */
canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* ÁREA DO SPIDER-MAN */
.spider-area {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
}

/* PERSONAGEM */
.spiderman {
    position: absolute;
    left: 50%;
    top: -260px;

    width: 90px;
    height: 150px;

    transform: translateX(-50%) scale(1);

    image-rendering: pixelated;

    animation:
        spiderMove 7s ease-in-out infinite,
        spiderSwing 2s ease-in-out infinite;

    filter:
        drop-shadow(0 0 8px rgba(255, 0, 50, .5));
}

/*
    CABEÇA
*/
.head {
    position: absolute;

    width: 52px;
    height: 58px;

    left: 19px;
    top: 0;

    background:
        linear-gradient(
            135deg,
            #e51b23 0%,
            #a90008 100%
        );

    border: 4px solid #050505;

    border-radius: 48% 48% 45% 45%;

    box-shadow:
        inset 5px 5px 0 rgba(255,255,255,.08);
}

/* TEIA DA CABEÇA */
.head::before {
    content: "";

    position: absolute;
    inset: 5px;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 9px,
            rgba(0,0,0,.65) 10px,
            transparent 11px
        );

    opacity: .7;
}

/* OLHO ESQUERDO */
.eye-left,
.eye-right {
    position: absolute;

    top: 19px;

    width: 17px;
    height: 27px;

    background: white;

    border: 3px solid #050505;

    transform: skew(-10deg);
}

.eye-left {
    left: 6px;
}

.eye-right {
    right: 6px;
    transform: skew(10deg);
}

/*
    CORPO
*/
.body {
    position: absolute;

    left: 17px;
    top: 52px;

    width: 56px;
    height: 62px;

    background:
        linear-gradient(
            90deg,
            #b9000a 0%,
            #e31b23 45%,
            #b9000a 100%
        );

    border: 4px solid #050505;

    border-radius: 15px 15px 8px 8px;
}

/* TEIA NO CORPO */
.body::before {
    content: "✦";

    position: absolute;

    left: 17px;
    top: 12px;

    color: #111;

    font-size: 23px;

    text-shadow:
        0 0 0 #111,
        0 8px 0 #111;
}

/*
    BRAÇOS
*/
.arm {
    position: absolute;

    width: 18px;
    height: 67px;

    background: #c70d15;

    border: 4px solid #050505;

    border-radius: 10px;
}

.arm.left {
    left: 2px;
    top: 55px;

    transform:
        rotate(25deg);
}

.arm.right {
    right: 2px;
    top: 55px;

    transform:
        rotate(-25deg);
}

/*
    MÃOS
*/
.hand {
    position: absolute;

    width: 17px;
    height: 17px;

    background: #c70d15;

    border: 3px solid #050505;

    border-radius: 50%;
}

.hand.left {
    left: -5px;
    top: 111px;
}

.hand.right {
    right: -5px;
    top: 111px;
}

/*
    PERNAS
*/
.leg {
    position: absolute;

    width: 20px;
    height: 54px;

    top: 105px;

    background:
        linear-gradient(
            90deg,
            #101c55,
            #172b8a
        );

    border: 4px solid #050505;

    border-radius: 5px;
}

.leg.left {
    left: 20px;

    transform:
        rotate(8deg);
}

.leg.right {
    right: 20px;

    transform:
        rotate(-8deg);
}

/*
    TEIA DESCENDO
*/
.web {
    position: absolute;

    width: 3px;

    height: 260px;

    background:
        repeating-linear-gradient(
            to bottom,
            #fff 0px,
            #fff 5px,
            transparent 5px,
            transparent 11px
        );

    left: 50%;

    top: 0;

    transform:
        translateX(-50%);

    opacity: .85;

    animation:
        webPulse 1.2s ease-in-out infinite;
}

.web::after {
    content: "";

    position: absolute;

    width: 45px;
    height: 45px;

    border: 2px solid rgba(255,255,255,.8);

    border-radius: 50%;

    left: 50%;
    top: 20px;

    transform: translateX(-50%);

    box-shadow:
        0 0 0 8px transparent,
        0 0 0 10px rgba(255,255,255,.25);
}

/*
    PARTICULAS DO SPIDER-MAN
*/
.pixel {
    position: absolute;

    width: 5px;
    height: 5px;

    background: #ff1744;

    opacity: 0;

    animation: pixelFloat 3s linear infinite;
}

.pixel:nth-child(1) {
    left: 20%;
    top: 20%;
    animation-delay: .2s;
}

.pixel:nth-child(2) {
    left: 70%;
    top: 35%;
    animation-delay: .8s;
}

.pixel:nth-child(3) {
    left: 40%;
    top: 50%;
    animation-delay: 1.2s;
}

.pixel:nth-child(4) {
    left: 80%;
    top: 60%;
    animation-delay: 1.7s;
}

.pixel:nth-child(5) {
    left: 15%;
    top: 70%;
    animation-delay: 2.2s;
}

/*
    MOVIMENTO
*/
@keyframes spiderMove {

    0% {
        top: -260px;
    }

    20% {
        top: 18%;
    }

    45% {
        top: 45%;
    }

    70% {
        top: 25%;
    }

    100% {
        top: 110%;
    }
}

@keyframes spiderSwing {

    0%, 100% {
        margin-left: -15px;
        rotate: -3deg;
    }

    50% {
        margin-left: 15px;
        rotate: 3deg;
    }
}

@keyframes webPulse {

    0%, 100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }
}

@keyframes pixelFloat {

    0% {
        transform:
            translate(0, 0)
            scale(.3);

        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    100% {
        transform:
            translate(
                40px,
                100px
            )
            scale(1.4);

        opacity: 0;
    }
}

/* CELULAR */
@media (max-width: 600px) {

    .spiderman {
        transform:
            translateX(-50%)
            scale(.75);
    }
}
</style>
</head>

<body>

<!-- =====================================================
     SPIDER-MAN
===================================================== -->

<div class="spider-area">

    <div class="spiderman">

        <div class="web"></div>

        <div class="head">
            <div class="eye-left"></div>
            <div class="eye-right"></div>
        </div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="body"></div>

        <div class="hand left"></div>
        <div class="hand right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>

    <div class="pixel"></div>
    <div class="pixel"></div>
    <div class="pixel"></div>
    <div class="pixel"></div>
    <div class="pixel"></div>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    .1,
    1000
);

camera.position.set(
    0,
    5,
    25
);

camera.lookAt(
    0,
    1,
    0
);


/* RENDERER */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   CORAÇÃO
===================================================== */

const heartGroup =
    new THREE.Group();

scene.add(
    heartGroup
);


function heartFunction(t) {

    const x =
        8 * Math.pow(
            Math.sin(t),
            3
        );

    const y =
        8 * Math.cos(t)
        - 3 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x,
        y
    };
}


const heartGeometry =
    new THREE.BufferGeometry();

const positions = [];

const heartParticles = [];

const particleCount = 4200;


for (
    let i = 0;
    i < particleCount;
    i++
) {

    const t =
        Math.random() *
        Math.PI *
        2;

    const heart =
        heartFunction(t);

    const scale =
        Math.sqrt(
            Math.random()
        );

    let x =
        heart.x *
        scale *
        .45;

    let y =
        heart.y *
        scale *
        .45;

    let z =
        (
            Math.random() -
            .5
        ) * 2.3;

    y += 2;

    positions.push(
        x,
        y,
        z
    );

    heartParticles.push({
        x,
        y,
        z,
        phase:
            Math.random() *
            Math.PI *
            2
    });
}


heartGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        positions,
        3
    )
);


const heartMaterial =
    new THREE.PointsMaterial({

        color:
            0xff1493,

        size:
            .075,

        transparent:
            true,

        opacity:
            .85,

        blending:
            THREE.AdditiveBlending,

        depthWrite:
            false
    });


const heart =
    new THREE.Points(
        heartGeometry,
        heartMaterial
    );

heartGroup.add(
    heart
);


/* =====================================================
   PARTICULAS AO REDOR
===================================================== */

const ambientGeometry =
    new THREE.BufferGeometry();

const ambientPositions = [];

const ambientCount = 1800;

for (
    let i = 0;
    i < ambientCount;
    i++
) {

    const angle =
        Math.random() *
        Math.PI *
        2;

    const radius =
        3 +
        Math.random() *
        12;

    const x =
        Math.cos(angle) *
        radius;

    const z =
        Math.sin(angle) *
        radius;

    const y =
        -2 +
        Math.random() *
        9;

    ambientPositions.push(
        x,
        y,
        z
    );
}


ambientGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        ambientPositions,
        3
    )
);


const ambientMaterial =
    new THREE.PointsMaterial({

        color:
            0xff4fc3,

        size:
            .045,

        transparent:
            true,

        opacity:
            .5,

        blending:
            THREE.AdditiveBlending,

        depthWrite:
            false
    });


const ambient =
    new THREE.Points(
        ambientGeometry,
        ambientMaterial
    );

scene.add(
    ambient
);


/* =====================================================
   ONDAS
===================================================== */

const rings = [];

for (
    let i = 0;
    i < 15;
    i++
) {

    const geometry =
        new THREE.RingGeometry(
            2 +
            i * .5,

            2.03 +
            i * .5,

            128
        );

    const material =
        new THREE.MeshBasicMaterial({

            color:
                0xff1493,

            transparent:
                true,

            opacity:
                .04 +
                (
                    1 -
                    i / 15
                ) * .13,

            side:
                THREE.DoubleSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false
        });


    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.rotation.x =
        -Math.PI / 2;

    ring.position.y =
        -1.8;

    ring.scale.set(
        1.6,
        .65,
        1
    );

    scene.add(
        ring
    );

    rings.push(
        ring
    );
}


/* =====================================================
   LUZ CENTRAL
===================================================== */

const glowGeometry =
    new THREE.SphereGeometry(
        .3,
        24,
        24
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0xffffff,

        transparent:
            true,

        opacity:
            .9
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

glow.position.y =
    -1.7;

scene.add(
    glow
);


/* =====================================================
   ANIMAÇÃO
===================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );

    const time =
        clock.getElapsedTime();


    /* CORAÇÃO PULSANDO */

    const pulse =
        1 +
        Math.sin(
            time * 2.5
        ) * .035;

    heartGroup.scale.set(
        pulse,
        pulse,
        pulse
    );


    /* MOVIMENTO DAS PARTÍCULAS */

    const heartPosition =
        heartGeometry.attributes.position;


    for (
        let i = 0;
        i < heartParticles.length;
        i++
    ) {

        const p =
            heartParticles[i];

        const index =
            i * 3;

        heartPosition.array[
            index
        ] =
            p.x +
            Math.sin(
                time * 1.5 +
                p.phase
            ) * .015;

        heartPosition.array[
            index + 1
        ] =
            p.y +
            Math.sin(
                time * 1.8 +
                p.phase
            ) * .02;

        heartPosition.array[
            index + 2
        ] =
            p.z +
            Math.cos(
                time * 1.3 +
                p.phase
            ) * .03;
    }


    heartPosition.needsUpdate =
        true;


    /* ROTAÇÃO DAS ONDAS */

    rings.forEach(
        (ring, i) => {

            ring.rotation.z =
                time *
                (.01 + i * .0003);

            const wave =
                1 +
                Math.sin(
                    time * 1.4 +
                    i
                ) * .02;

            ring.scale.x =
                1.6 * wave;

            ring.scale.y =
                .65 * wave;
        }
    );


    /* MOVIMENTO DO FUNDO */

    ambient.rotation.y =
        time * .015;


    /* BRILHO */

    const glowScale =
        1 +
        Math.sin(
            time * 4
        ) * .2;

    glow.scale.set(
        glowScale,
        glowScale,
        glowScale
    );


    /* CÂMERA */

    camera.position.x =
        Math.sin(
            time * .15
        ) * 1.1;

    camera.position.y =
        5 +
        Math.sin(
            time * .2
        ) * .25;

    camera.lookAt(
        0,
        1,
        0
    );


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   RESPONSIVO
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* INICIAR */

animate();

</script>

</body>
</html>
