<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vamos Voltar ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}

/* CANVAS DO CORAÇÃO */
canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
}

/* CAMADA DAS PALAVRAS */
#palavras {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
    perspective: 1000px;
}

/* PALAVRAS */
.palavra {
    position: absolute;
    left: 50%;
    top: 50%;

    color: white;
    font-weight: bold;
    white-space: nowrap;

    text-shadow:
        0 0 5px white,
        0 0 10px #ff2f6d,
        0 0 20px #ff2f6d,
        0 0 35px #ff004c;

    transform-origin: center center;

    transition:
        transform 0.15s linear,
        opacity 0.15s linear;
}

/* FRASE PRINCIPAL */
#principal {
    font-size: clamp(20px, 5vw, 42px);
    color: #fff;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #ff174f,
        0 0 30px #ff174f,
        0 0 50px #ff174f;
}

/* TÍTULO */
.titulo {
    position: fixed;
    top: 25px;
    left: 0;
    width: 100%;

    text-align: center;

    color: white;
    font-size: 20px;
    font-weight: bold;

    z-index: 30;

    text-shadow:
        0 0 10px #ff174f,
        0 0 25px #ff174f;
}

/* FRASE EMBAIXO */
.frase {
    position: fixed;
    bottom: 25px;
    left: 0;
    width: 100%;

    text-align: center;

    color: white;
    font-size: 17px;

    z-index: 30;

    text-shadow:
        0 0 8px #ff174f,
        0 0 20px #ff174f;
}
</style>
</head>

<body>

<div class="titulo">
    ❤️
</div>

<!-- PALAVRAS QUE VÃO ORBITAR -->
<div id="palavras">

    <div class="palavra" id="principal">
        VAMOS VOLTAR!!!
    </div>

    <div class="palavra">
        AMOR
    </div>

    <div class="palavra">
        MORIN
    </div>

    <div class="palavra">
        SAUDADE
    </div>

    <div class="palavra">
        VOCÊ
    </div>

    <div class="palavra">
        SEMPRE
    </div>

    <div class="palavra">
        EU TE AMO
    </div>

    <div class="palavra">
        ❤️
    </div>

    <div class="palavra">
        MEU BEM
    </div>

    <div class="palavra">
        PARA SEMPRE
    </div>

</div>

<div class="frase">
    ❤️ VAMOS VOLTAR!!! ❤️
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* ==================================================
   CENA
================================================== */

const scene = new THREE.Scene();


/* ==================================================
   CÂMERA
================================================== */

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.z = 30;


/* ==================================================
   RENDERIZADOR
================================================== */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


/* ==================================================
   GRUPO DO CORAÇÃO
================================================== */

const heartGroup =
    new THREE.Group();

scene.add(
    heartGroup
);


/* ==================================================
   CORAÇÃO DE PARTÍCULAS
================================================== */

const particleCount = 6000;

const positions =
    new Float32Array(
        particleCount * 3
    );

const colors =
    new Float32Array(
        particleCount * 3
    );

for (
    let i = 0;
    i < particleCount;
    i++
) {

    const t =
        Math.random() *
        Math.PI * 2;

    const scale =
        Math.sqrt(
            Math.random()
        );

    /*
       Fórmula do coração
    */

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13 *
        Math.cos(t)
        - 5 *
        Math.cos(2 * t)
        - 2 *
        Math.cos(3 * t)
        - Math.cos(4 * t);

    const z =
        (Math.random() - 0.5) * 5;

    const index =
        i * 3;

    positions[index] =
        x * 0.65 * scale;

    positions[index + 1] =
        y * 0.65 * scale;

    positions[index + 2] =
        z * scale;

    colors[index] = 1;
    colors[index + 1] = 0.08;
    colors[index + 2] = 0.35;
}


/* ==================================================
   GEOMETRIA
================================================== */

const heartGeometry =
    new THREE.BufferGeometry();

heartGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);

heartGeometry.setAttribute(
    "color",
    new THREE.BufferAttribute(
        colors,
        3
    )
);


/* ==================================================
   MATERIAL
================================================== */

const heartMaterial =
    new THREE.PointsMaterial({

        size: 0.09,

        vertexColors: true,

        transparent: true,

        opacity: 0.95,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });


/* ==================================================
   CORAÇÃO
================================================== */

const heart =
    new THREE.Points(
        heartGeometry,
        heartMaterial
    );

heartGroup.add(
    heart
);


/* ==================================================
   BRILHO DO CORAÇÃO
================================================== */

const glowGeometry =
    new THREE.SphereGeometry(
        5,
        32,
        32
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xff174f,

        transparent: true,

        opacity: 0.07,

        blending:
            THREE.AdditiveBlending
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

heartGroup.add(
    glow
);


/* ==================================================
   PARTÍCULAS AO REDOR
================================================== */

const ambientCount = 1800;

const ambientPositions =
    new Float32Array(
        ambientCount * 3
    );

for (
    let i = 0;
    i < ambientCount;
    i++
) {

    const index =
        i * 3;

    ambientPositions[index] =
        (Math.random() - 0.5) * 60;

    ambientPositions[index + 1] =
        (Math.random() - 0.5) * 50;

    ambientPositions[index + 2] =
        (Math.random() - 0.5) * 40;
}

const ambientGeometry =
    new THREE.BufferGeometry();

ambientGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        ambientPositions,
        3
    )
);

const ambientMaterial =
    new THREE.PointsMaterial({

        color: 0xff3366,

        size: 0.05,

        transparent: true,

        opacity: 0.7,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });

const ambient =
    new THREE.Points(
        ambientGeometry,
        ambientMaterial
    );

scene.add(
    ambient
);


/* ==================================================
   ANÉIS
================================================== */

for (
    let i = 0;
    i < 15;
    i++
) {

    const geometry =
        new THREE.RingGeometry(
            9 + i * 0.7,
            9.03 + i * 0.7,
            128
        );

    const material =
        new THREE.MeshBasicMaterial({

            color: 0xff3366,

            transparent: true,

            opacity:
                0.07,

            side:
                THREE.DoubleSide,

            blending:
                THREE.AdditiveBlending
        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.rotation.x =
        Math.PI / 2;

    scene.add(
        ring
    );
}


/* ==================================================
   PALAVRAS 3D
================================================== */

const elementos =
    document.querySelectorAll(
        ".palavra"
    );

const palavras = [];


/*
   Distribuição inicial
*/

elementos.forEach(
    (elemento, index) => {

        const angle =
            (index /
            elementos.length) *
            Math.PI * 2;

        const radius =
            180 +
            Math.random() * 70;

        const altura =
            (Math.random() - 0.5) *
            180;

        palavras.push({

            elemento:
                elemento,

            angle:
                angle,

            radius:
                radius,

            altura:
                altura,

            velocidade:
                0.002 +
                Math.random() *
                0.003,

            tamanho:
                0.8 +
                Math.random() *
                0.5

        });

    }
);


/* ==================================================
   ANIMAÇÃO
================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );

    const tempo =
        clock.getElapsedTime();


    /* -------------------------------
       CORAÇÃO
    -------------------------------- */

    heartGroup.rotation.y =
        tempo * 0.25;

    heartGroup.rotation.x =
        Math.sin(
            tempo * 0.5
        ) * 0.08;


    /* -------------------------------
       PULSAÇÃO
    -------------------------------- */

    const pulse =
        1 +
        Math.sin(
            tempo * 3
        ) * 0.05;

    heartGroup.scale.set(
        pulse,
        pulse,
        pulse
    );


    /* -------------------------------
       BRILHO
    -------------------------------- */

    glow.material.opacity =
        0.06 +
        Math.sin(
            tempo * 3
        ) * 0.025;


    /* -------------------------------
       PARTÍCULAS
    -------------------------------- */

    ambient.rotation.y =
        tempo * 0.015;


    /* -------------------------------
       CÂMERA
    -------------------------------- */

    camera.position.x =
        Math.sin(
            tempo * 0.15
        ) * 2;

    camera.position.y =
        Math.cos(
            tempo * 0.15
        ) * 1;

    camera.lookAt(
        0,
        0,
        0
    );


    /* ==================================================
       PALAVRAS ORBITANDO
    ================================================== */

    palavras.forEach(
        (p, index) => {

            p.angle +=
                p.velocidade;


            /*
               Movimento circular
            */

            const x =
                Math.cos(
                    p.angle
                ) *
                p.radius;

            const y =
                p.altura +
                Math.sin(
                    tempo * 0.8 +
                    index
                ) * 35;

            const z =
                Math.sin(
                    p.angle
                ) *
                p.radius;


            /*
               Converte posição 3D
               para posição na tela
            */

            const vetor =
                new THREE.Vector3(
                    x,
                    y,
                    z
                );

            vetor.project(
                camera
            );


            const screenX =
                (vetor.x * 0.5 + 0.5) *
                window.innerWidth;

            const screenY =
                (-vetor.y * 0.5 + 0.5) *
                window.innerHeight;


            /*
               Profundidade
            */

            const profundidade =
                (z + p.radius) /
                (p.radius * 2);

            let escala =
                0.7 +
                profundidade * 0.7;


            /*
               VAMOS VOLTAR
               sempre maior
            */

            if (index === 0) {

                escala *= 1.25;

            }


            /*
               Opacidade baseada
               na profundidade
            */

            let opacidade =
                0.35 +
                profundidade * 0.65;


            /*
               Mantém a frase visível
            */

            if (index === 0) {

                opacidade = 1;

            }


            p.elemento.style.left =
                screenX + "px";

            p.elemento.style.top =
                screenY + "px";

            p.elemento.style.transform =
                "translate(-50%, -50%) " +
                "scale(" +
                escala +
                ")";

            p.elemento.style.opacity =
                opacidade;

        }
    );


    /* -------------------------------
       RENDER
    -------------------------------- */

    renderer.render(
        scene,
        camera
    );
}


animate();


/* ==================================================
   RESPONSIVO
================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
