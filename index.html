
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vamos Voltar ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

/* PALAVRAS FLUTUANTES */
.palavra {
    position: fixed;
    color: white;
    font-weight: bold;
    font-size: 18px;
    text-shadow:
        0 0 5px #fff,
        0 0 10px #ff4d88,
        0 0 20px #ff4d88;
    pointer-events: none;
    z-index: 10;
    animation: flutuar 4s ease-in-out infinite;
    opacity: 0;
}

@keyframes flutuar {
    0% {
        transform: translateY(20px) scale(0.8);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    50% {
        transform: translateY(-20px) scale(1);
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        transform: translateY(-50px) scale(0.8);
        opacity: 0;
    }
}

/* POSIÇÕES */
.p1 {
    top: 15%;
    left: 8%;
    animation-delay: 0s;
}

.p2 {
    top: 25%;
    right: 8%;
    animation-delay: 1s;
}

.p3 {
    top: 45%;
    left: 5%;
    animation-delay: 2s;
}

.p4 {
    top: 55%;
    right: 5%;
    animation-delay: 3s;
}

.p5 {
    top: 70%;
    left: 12%;
    animation-delay: 1.5s;
}

.p6 {
    top: 75%;
    right: 12%;
    animation-delay: 2.5s;
}

.p7 {
    top: 10%;
    left: 45%;
    animation-delay: 0.7s;
}

.p8 {
    top: 85%;
    left: 43%;
    animation-delay: 1.8s;
}

.p9 {
    top: 38%;
    left: 15%;
    animation-delay: 2.2s;
}

.p10 {
    top: 38%;
    right: 15%;
    animation-delay: 3.2s;
}

/* TÍTULO */
.titulo {
    position: fixed;
    top: 5%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 24px;
    font-weight: bold;
    z-index: 20;
    text-shadow:
        0 0 10px #ff4d88,
        0 0 25px #ff4d88;
}

/* FRASE INFERIOR */
.frase {
    position: fixed;
    bottom: 5%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 18px;
    z-index: 20;
    text-shadow:
        0 0 8px #ff4d88,
        0 0 15px #ff4d88;
}
</style>
</head>

<body>

<div class="titulo">
    ❤️
</div>

<!-- PALAVRAS -->
<div class="palavra p1">VAMOS VOLTAR!!!</div>
<div class="palavra p2">AMOR</div>
<div class="palavra p3">CARINHO</div>
<div class="palavra p4">SAUDADE</div>
<div class="palavra p5">VOCÊ</div>
<div class="palavra p6">SEMPRE</div>
<div class="palavra p7">SONHO</div>
<div class="palavra p8">❤️</div>
<div class="palavra p9">MEU BEM</div>
<div class="palavra p10">PARA SEMPRE</div>

<div class="frase">
    ❤️ VAMOS VOLTAR!!! ❤️
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   CENA
========================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.z = 30;


/* =========================
   RENDERIZADOR
========================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(renderer.domElement);


/* =========================
   GRUPO DO CORAÇÃO
========================= */

const heartGroup = new THREE.Group();

scene.add(heartGroup);


/* =========================
   CORAÇÃO DE PARTÍCULAS
========================= */

const particleCount = 6000;

const positions = new Float32Array(
    particleCount * 3
);

const colors = new Float32Array(
    particleCount * 3
);

for (let i = 0; i < particleCount; i++) {

    const t =
        Math.random() *
        Math.PI * 2;

    const r =
        Math.sqrt(Math.random());

    /*
      Equação do coração
    */

    const x =
        16 *
        Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    const z =
        (Math.random() - 0.5) * 4;

    const index = i * 3;

    positions[index] =
        x * 0.65 * r;

    positions[index + 1] =
        y * 0.65 * r;

    positions[index + 2] =
        z * r;

    /*
      Cor das partículas
    */

    colors[index] = 1;
    colors[index + 1] = 0.15;
    colors[index + 2] = 0.4;
}


/* =========================
   GEOMETRIA
========================= */

const heartGeo =
    new THREE.BufferGeometry();

heartGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);

heartGeo.setAttribute(
    "color",
    new THREE.BufferAttribute(
        colors,
        3
    )
);


/* =========================
   MATERIAL
========================= */

const heartMat =
    new THREE.PointsMaterial({

        size: 0.09,

        vertexColors: true,

        transparent: true,

        opacity: 0.95,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });


/* =========================
   CORAÇÃO
========================= */

const heart =
    new THREE.Points(
        heartGeo,
        heartMat
    );

heartGroup.add(heart);


/* =========================
   BRILHO CENTRAL
========================= */

const glowGeometry =
    new THREE.SphereGeometry(
        5,
        32,
        32
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xff174f,
        transparent: true,
        opacity: 0.08,
        blending:
            THREE.AdditiveBlending
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

heartGroup.add(glow);


/* =========================
   PARTÍCULAS AO REDOR
========================= */

const ambientCount = 1800;

const ambientPositions =
    new Float32Array(
        ambientCount * 3
    );

for (
    let i = 0;
    i < ambientCount;
    i++
) {

    const index = i * 3;

    ambientPositions[index] =
        (Math.random() - 0.5) * 60;

    ambientPositions[index + 1] =
        (Math.random() - 0.5) * 50;

    ambientPositions[index + 2] =
        (Math.random() - 0.5) * 40;
}

const ambientGeo =
    new THREE.BufferGeometry();

ambientGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        ambientPositions,
        3
    )
);

const ambientMat =
    new THREE.PointsMaterial({

        color: 0xff4d88,

        size: 0.05,

        transparent: true,

        opacity: 0.7,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });

const ambient =
    new THREE.Points(
        ambientGeo,
        ambientMat
    );

scene.add(ambient);


/* =========================
   ANÉIS DE LUZ
========================= */

for (
    let i = 0;
    i < 18;
    i++
) {

    const ringGeometry =
        new THREE.RingGeometry(
            9 + i * 0.7,
            9.03 + i * 0.7,
            128
        );

    const ringMaterial =
        new THREE.MeshBasicMaterial({

            color: 0xff3366,

            transparent: true,

            opacity:
                0.08 -
                i * 0.002,

            side:
                THREE.DoubleSide,

            blending:
                THREE.AdditiveBlending
        });

    const ring =
        new THREE.Mesh(
            ringGeometry,
            ringMaterial
        );

    ring.rotation.x =
        Math.PI / 2;

    ring.position.y =
        (Math.random() - 0.5) * 2;

    scene.add(ring);
}


/* =========================
   ANIMAÇÃO
========================= */

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(
        animate
    );

    const time =
        clock.getElapsedTime();


    /* coração girando */

    heartGroup.rotation.y =
        time * 0.25;

    heartGroup.rotation.x =
        Math.sin(time * 0.5) * 0.08;


    /* pulsação */

    const pulse =
        1 +
        Math.sin(time * 3) *
        0.05;

    heartGroup.scale.set(
        pulse,
        pulse,
        pulse
    );


    /* brilho pulsando */

    glow.material.opacity =
        0.06 +
        Math.sin(time * 3) *
        0.025;


    /* partículas */

    ambient.rotation.y =
        time * 0.015;

    ambient.rotation.x =
        Math.sin(time * 0.1) *
        0.05;


    /* câmera */

    camera.position.x =
        Math.sin(time * 0.15) * 2;

    camera.position.y =
        Math.cos(time * 0.15) * 1;

    camera.lookAt(
        0,
        0,
        0
    );


    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================
   RESPONSIVO
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
